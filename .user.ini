; Larger image uploads for the Hub (news hero/gallery, media library).
; PHP-FPM reads this per-directory; changes apply within user_ini.cache_ttl (5 min)
; or immediately on an FPM reload.
upload_max_filesize = 32M
post_max_size = 40M
max_execution_time = 180

; Host-only session cookies. The server-wide php.ini sets cookie_domain=.lundy.me.uk,
; which browsers reject on this domain (broke CSRF/basket: "session expired").
session.cookie_domain =
